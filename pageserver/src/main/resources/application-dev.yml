spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${OPENNLG_DB_URL:jdbc:mysql://127.0.0.1:3306/opennlg?serverTimezone=Asia/Shanghai&characterEncoding=utf8&useSSL=false}
    username: ${OPENNLG_DB_USERNAME:opennlg_dev}
    password: ${OPENNLG_DB_PASSWORD}
    hikari:
      pool-name: DataHikaricp
      minimum-idle: 5
      idle-timeout: 180000
      maximum-pool-size: 10
      auto-commit: true
      max-lifetime: 180000
      connection-timeout: 30000
      connection-test-query: SELECT 1
  servlet:
    multipart:
      max-file-size: 70MB
      max-request-size: 120MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/*Mapper.xml
  type-aliases-package: com.opennlg.pojo
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl




logging:
  level:
    com.opennlg.mapper: debug


jwt:
  # Jwt存储的请求头
  tokenHeader: Authorization
  # Jwt加密秘钥
  secret: ${OPENNLG_JWT_SECRET:change-this-development-secret-before-network-use}
  # Jwt 的超期限时间（60*60）*24
  expiration: 604800
  # Jwt负载中拿到开头
  tokenHead: Bearer


# swagger参数配置
swagger:
  base-package: com.opennlg.controller
  docket:
    enable: true
  api-info:
    title: OpenNLG WebSite
    description: OpenNLG WebSite API
    author: 刘腾
    url: http://localhost/doc.html
    email: xmliuteng@163.com
    version: 1.0

# 设置静态资源路径
file:
  path: ${OPENNLG_FILE_PATH:/absolute/path/to/opennlg/files/}
  resource-path: /files/**
  domain: ${OPENNLG_FILE_DOMAIN:http://localhost:3000/files/}
